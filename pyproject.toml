
[project]
name = "redshift-catalog-curation-assistant"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Luigi Lucas de Carvalho Silva", email = "luigi.lcsilva@gmail.com" }
]
description = "A simple, reproducible and extensible tool to aid in the technical curation of heterogeneous redshift catalogs."
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12.2",
    "dask[dataframe,distributed]>=2024.5.0",
    "dask-jobqueue>=0.8",
    "pyarrow>=12.0",
    "astropy>=5.3",
    "fitsio>=1.3",
    "hats>=0.9.2",
    "lsdb>=0.9.2",
    "hats-import>=0.9.2",
    "nbclient>=0.8",
    "nbconvert>=7.8",
    "nbformat>=5.9",
    "ipykernel>=6.25",
]

[project.scripts]
redshift-curator = "redshift_catalog_curation_assistant.cli.cli:main"

[project.urls]
"Source Code" = "https://github.com/linea-it/redshift-catalog-curation-assistant"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
docs = [
    "ipykernel",
    "ipython",
    "jupytext",
    "myst-parser",
    "nbconvert",
    "nbsphinx",
    "sphinx",
    "sphinx-autoapi",
    "sphinx-copybutton",
    "sphinx-rtd-theme>=3.1.0",
]
dev = [
    "asv[virtualenv]==0.6.6", # Used to compute performance benchmarks
    "jupyter>=1.0", # Clears output from Jupyter notebooks
    "myst-parser", # Used to render Markdown documentation in Sphinx
    "mypy>=1.8", # Used for static type checking of files
    "nbsphinx", # Used to render notebooks in Sphinx documentation
    "pre-commit>=3.5", # Used to run checks before finalizing a git commit
    "pytest>=7.4",
    "pytest-cov>=4.1", # Used to report total code coverage
    "ruff>=0.2.1", # Used for static linting of files
    "sphinx", # Used to build project documentation
    "sphinx-autoapi", # Used to build API reference documentation
    "sphinx-copybutton", # Used for copy buttons on documentation code blocks
    "sphinx-rtd-theme>=3.1.0", # Used as the documentation HTML theme
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/redshift_catalog_curation_assistant/_version.py"

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
    "src",
    "docs",
]
addopts = "--doctest-modules --doctest-glob=*.rst"

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]

[tool.ruff.lint.isort]
known-first-party = ["redshift_catalog_curation_assistant"]

[tool.mypy]
python_version = "3.11"
follow_imports = "skip"
[tool.setuptools.package-data]
redshift_catalog_curation_assistant = ["py.typed"]

[tool.coverage.run]
omit=["src/redshift_catalog_curation_assistant/_version.py"]

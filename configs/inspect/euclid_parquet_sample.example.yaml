input_file: data_not_tracked/part0.snappy.parquet
survey_name: EUCLID_PARQUET_SAMPLE
unique_limit: 10

# Available stats modes:
#   candidates: always compute stats only for candidate columns
#   all: compute stats for all eligible columns
#   none: skip statistics
stats_mode: candidates
sample_max_columns: 100

# Parquet inspect uses a PyArrow-based path instead of Dask DataFrame.
# This controls how many columns are read per stats batch when stats_mode needs many columns.
parquet_stats_batch_size: 50

column_patterns:
  ra:
    - "^ra$"
    - "(^|_)right_ascension($|_)"
  dec:
    - "^dec$"
    - "(^|_)declination($|_)"
  redshift:
    - "^z$"
    - "(^|_)redshift($|_)"
    - "^physparam_phz_pp_mode_redshift$"
    - "^physparam_phz_pp_median_redshift$"
    - "^physparam_phz_pp_68_redshift$"
  quality:
    - "(^|_)quality($|_)"
    - "(^|_)flag($|_)"
    - "^z_spe_.*_(error|warning)_flag$"
  redshift_error:
    - "(^|_)z_err($|_)"
    - "(^|_)z_error($|_)"
    - "^z_(galaxy|qso)_candidates_spe_z_err_rank[0-9]+$"
  id:
    - "^object_id$"
    - "^tileid$"
  object_type:
    - "^class_.*"
    - "^z_spe_class$"
    - "^z_(galaxy|star|qso)_candidates_spe_subclass_rank[0-9]+$"

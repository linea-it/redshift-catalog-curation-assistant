input_file: tests/data/raw/elaisfbmc_sample
survey_name: ELAISFBMC_COLLECTION
output_dir: reports/inspect/elaisfbmc

stats_mode: candidates
sample_max_columns: 20
sample_seed: 42

column_patterns:
  ra:
    - "^RAdeg$"
  dec:
    - "^DEdeg$"
  redshift:
    - "^zbest$"
    - "^zsp$"
  quality:
    - "^zbest_quality$"
  object_type:
    - "^zbest_type$"

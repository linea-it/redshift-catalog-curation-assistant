input_file: tests/data/raw/sdss_dr19_sample.fits
output_dir: reports/curated/sdss_dr19.parquet
overwrite: true
fits_hdu: 1

column_selection:
  - SPECOBJID
  - SDSS_ID
  - RACAT
  - DECCAT
  - Z
  - Z_ERR
  - ZWARNING
  - CLASS
  - SUBCLASS

coordinates:
  ra_column: RACAT
  dec_column: DECCAT

redshift:
  column: Z
  invalid_policy: flag

transformations:
  - type: add_constant_column
    name: survey_name
    value: SDSS_DR19_SPALL

input_file: tests/data/raw/euclid_q1_sample.snappy.parquet
output_dir: reports/curated/euclid_parquet_sample.parquet
overwrite: true

column_selection:
  - object_id
  - tileid
  - ra
  - dec
  - redshift
  - physparam_quality_flag

coordinates:
  ra_column: ra
  dec_column: dec

redshift:
  column: redshift
  invalid_policy: flag

transformations:
  - type: coalesce_redshift
    output_column: redshift
    columns:
      - physparam_phz_pp_mode_redshift
      - physparam_phz_pp_median_redshift
    invalid_value: -1
  - type: add_constant_column
    name: survey_name
    value: EUCLID_PARQUET_SAMPLE

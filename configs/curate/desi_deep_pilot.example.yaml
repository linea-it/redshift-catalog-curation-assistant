input_file: tests/data/raw/desi_deep_pilot_sample.fits
output_dir: reports/curated/desi_deep_pilot.parquet
overwrite: true
fits_hdu: 1

column_selection:
  - TARGETID
  - TARGET_RA
  - TARGET_DEC
  - Z
  - ZERR
  - ZWARN
  - VI_quality
  - SPECTYPE

coordinates:
  ra_column: TARGET_RA
  dec_column: TARGET_DEC

redshift:
  column: Z
  invalid_policy: flag

transformations:
  - type: cast
    column: VI_quality
    dtype: float64
  - type: add_constant_column
    name: survey_name
    value: DESI_DEEP_PILOT

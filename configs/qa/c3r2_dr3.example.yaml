title: C3R2 DR3
subtitle: Basic dataset characterization
output_notebook: reports/qa/c3r2_dr3.ipynb
generate_html: true
output_html: reports/qa/c3r2_dr3.html
input_file: tests/data/curated/c3r2_dr3.parquet
input_format: parquet
include_absolute_input_path: false

header_images:
  - url: https://www.linea.org.br/brand/linea-logo-color.svg
    width: 100
    style: "padding: 40px"
  - url: https://cdn2.webdamdb.com/1280_c3PXjCZbPM23.png
    width: 180

summary:
  - "**Original file:** `C3R2-DR3-18june2021.txt`"
  - "**Data obtained from:** https://sites.google.com/view/c3r2-survey/catalog"
  - "**Schema:** https://sites.google.com/view/c3r2-survey/catalog"
  - "**Reference paper:** https://ui.adsabs.harvard.edu/abs/2021ApJS..256....9S/abstract"
  - "**Manipulations:** Inserted the `survey_name` column."

acknowledgments:
  - This notebook was supported by resources supplied by the Laboratório Interinstitucional de e-Astronomia (LIneA).
  - This work uses data from the C3R2 Survey. We acknowledge the C3R2 collaboration and cite Masters et al. (2017), Masters et al. (2019), and Stanford et al. (2021).

plots:
  spatial:
    ra_column: ra
    dec_column: dec
    footprints:
      - path: tests/data/curves/rubin_dp2_footprint.csv
        label: Rubin DP2 footprint
        color: red
      - path: tests/data/curves/rubin_footprint.csv
        label: Rubin footprint
        color: orange
  redshift:
    column: zspec
    range: [0, 4]
    bins: 50
  quality:
    column: Qual
    description: |
      | Qual | Description |
      |---|---|
      | 4.0 | Certain |
      | 3.5 | Very high confidence but based on a single line detection |
      | 3.0 | High confidence |

      **Source**: https://sites.google.com/view/c3r2-survey/catalog

input_file: tests/data/raw/desi_deep_pilot_sample.fits
output_dir: reports/prepared/desi_deep_pilot.parquet
fits_hdu: 1
chunk_size_rows: 200000
large_file_threshold_mb: 100
target_partition_size_mb: 100
output_mode: auto
allow_large_single_output: false
overwrite: true
part_prefix: desi_deep_pilot

dask_cluster:
  name: local
  args:
    n_workers: 3
    threads_per_worker: 1
    memory_limit: 2GB
    dashboard_address:


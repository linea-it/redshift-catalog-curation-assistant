input_file: tests/data/raw/2mrs_sample.fits
output_dir: reports/prepared/2mrs.parquet
fits_hdu: 1
chunk_size_rows: 200000
large_file_threshold_mb: 100
target_partition_size_mb: 100
output_mode: auto
allow_large_single_output: false
overwrite: true
part_prefix: 2mrs

dask_cluster:
  name: local
  args:
    n_workers: 3
    threads_per_worker: 1
    memory_limit: 2GB
    dashboard_address:

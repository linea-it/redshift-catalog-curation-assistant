input_file: data_not_tracked/part0.snappy.parquet
output_dir: reports/prepared/euclid_parquet_sample.parquet
chunk_size_rows: 200000
large_file_threshold_mb: 100
target_partition_size_mb: 100
output_mode: auto
allow_large_single_output: false
overwrite: true
part_prefix: euclid_parquet_sample

dask_cluster:
  name: local
  args:
    n_workers: 1
    threads_per_worker: 1
    memory_limit: 12GB
    dashboard_address:

